[package]
name = "instaproxy"
version = "0.1.0"
edition = "2021"
description = "A configurable public proxy scraper and health checker"
license = "MIT"
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/docs/assets/**",
    "/LICENSE",
    "/config.yaml",
    "/source.txt",
    "/build.bat",
    "/build.sh",
]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.13"
